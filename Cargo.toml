[package]
name = "erax"
version = "0.8.0-alpha"
edition = "2024"
license = "GPL-2.0-only"
description = "A modern, high-performance code editor for systems developers"
repository = "https://github.com/bonzupii/erax"
readme = "README.md"
keywords = ["editor", "text-editor", "code-editor", "terminal", "gpu"]
categories = ["command-line-utilities", "text-editors"]

[lints.rust]
warnings = "deny"      # DO NOT CHANGE
unsafe_code = "deny"   # DO NOT CHANGE
dead_code = "deny"     # DO NOT CHANGE
missing_docs = "allow" # TODO: Enable once APIs stabilize

# Shared dependencies: compile on both native and wasm32 (the presentation
# core and the wire protocol are shared 1:1 between the native shell and the
# web wasm shell).
[dependencies]
# Async
pollster = "0.4"

# Unicode
unicode-segmentation = "1.12"
unicode-width = "0.2"

# Presentation core (platform-agnostic; no winit, no fontdb scan)
wgpu = "30"
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
fontdb = "0.23"
sys-locale = "0.3"

# Wire protocol (typed, versioned frames)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Speech backend (optional; the `speech` cargo feature). Enabled only
# when the SPEECH_BACKEND config const is not Off; build.rs provisions
# the weights then. Native-only in practice (whisper-rs/ort do not
# target wasm32), but the provider traits compile everywhere.
# Licenses: docs/DEPENDENCIES.md (all MIT-leg or Apache-2.0/MIT).
anyhow = { version = "1", optional = true }
whisper-rs = { version = "=0.16.0", optional = true }
floravox-core = { version = "=0.8.8", optional = true }
floravox-g2p = { version = "=0.8.8", optional = true }
ort = { version = "=2.0.0-rc.14", optional = true }

[features]
default = []
speech = [
    "dep:anyhow",
    "dep:whisper-rs",
    "dep:floravox-core",
    "dep:floravox-g2p",
    "dep:ort",
]

# Native-only dependencies (the editor: TUI, server, native GUI shell).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# System
crossterm = "0.29"
libc = "0.2"  # mmap/munmap for the DS mmap prototype (session 6)
portable-pty = "0.9"

# WHATWG encodings (reference implementation for src/core/encoding.rs;
# UTF-32LE/BE are implemented in-house there since WHATWG lacks them).
# License: MIT OR Apache-2.0 (using the MIT leg per project licensing policy).
encoding_rs = "0.8"

# Native GUI shell (thinned winit; the core is in [dependencies])
winit = "0.30"

# Core
tempfile = "3.15"

# Sed
regex = "1.12"
similar = "3.2"

# Printing (N-267: cross-platform via printers crate)
printers = "2.3"

# Terminal emulation (always compiled, N-005: no feature gates)
vte = "0.15"
rustc-hash = "2.1.1"

# WebUI server (native WebSocket server)
tungstenite = "0.30.0"

# Web (wasm32) shell: the presentation core compiled to wasm + DOM glue.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlCanvasElement", "WebSocket", "MessageEvent", "KeyboardEvent", "MouseEvent", "WheelEvent", "InputEvent", "CompositionEvent", "Element", "HtmlElement", "Node", "Event", "EventTarget", "BinaryType", "Url", "Response", "Navigator"] }
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"

[dependencies.clap]
version = "4"
features = ["derive"]

[build-dependencies]
# Pure-Rust SHA-256 for verifying provisioned speech weights in build.rs.
sha2 = "0.10"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "hot_paths"
harness = false

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
