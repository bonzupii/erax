[package]
name = "erax-web-shell"
version = "0.8.0-alpha"
edition = "2024"
license = "GPL-2.0-only"
description = "Web (wasm32) shell for erax: the presentation core in the browser"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The presentation core and wire protocol are the SAME source files as the
# native build (included via #[path] in src/lib.rs) — no second
# representation, no drift.
# wgpu "webgl": the WebGL2 fallback backend for browsers whose WebGPU
# adapter request fails (the shell tries BROWSER_WEBGPU first).
wgpu = { version = "30", features = ["webgl"] }
bytemuck = { version = "1.21", features = ["derive"] }
cosmic-text = "0.19"
fontdb = "0.23"
sys-locale = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.12"
pollster = "0.4"

# Wasm/DOM glue
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlCanvasElement", "HtmlTextAreaElement", "CssStyleDeclaration", "WebSocket", "MessageEvent", "CloseEvent", "KeyboardEvent", "MouseEvent", "WheelEvent", "CompositionEvent", "InputEvent", "Element", "HtmlElement", "Node", "Event", "EventTarget", "BinaryType", "Url", "Response", "DomRect", "console", "Navigator", "Location", "AudioContext", "AudioContextState", "BaseAudioContext", "OscillatorNode", "OscillatorType", "GainNode", "AudioParam", "AudioDestinationNode"] }
rustc-hash = "2.1.3"

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

# Mirrors the root crate's release profile (see OPTLEVEL.md): opt-level 2 is
# the evidence-backed choice for this codebase, LTO + single codegen unit
# for size and determinism.
#
# Determinism matters here: the default release profile uses parallel
# codegen units, which reorder functions nondeterministically — two builds
# of identical sources produced different wasm bytes (session 8: md5
# 8ebaffa5… vs 17a4120e…). codegen-units = 1 makes the shipped
# web-assets/erax-web-shell_bg.wasm bit-reproducible.
[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
